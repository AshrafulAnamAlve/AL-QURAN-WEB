<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14603c"/>
      <stop offset="100%" stop-color="#093621"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#9a7a1c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Decorative Inner Border -->
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.45"/>

  <!-- Islamic Emblem / Quran Arch -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Mihrab / Dome silhouette -->
    <path d="M0 -150 C55 -105 80 -70 80 0 C80 30 70 50 0 50 C-70 50 -80 30 -80 0 C-80 -70 -55 -105 0 -150 Z"
          fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>

    <!-- Open Quran Book -->
    <path d="M-120 70 C-70 50 -20 70 0 90 C20 70 70 50 120 70 L120 -20 C70 -40 20 -20 0 0 C-20 -20 -70 -40 -120 -20 Z"
          fill="none" stroke="url(#gold)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Center spine -->
    <line x1="0" y1="0" x2="0" y2="90" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>

    <!-- Quran Ayah Mark Symbol ۩ -->
    <text x="0" y="5" font-family="'Amiri Quran', 'Traditional Arabic', serif" font-size="78"
          fill="url(#gold)" text-anchor="middle" dominant-baseline="central">۩</text>
  </g>
</svg>
