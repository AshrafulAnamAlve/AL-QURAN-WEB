<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Al-Quran — Read the Quran with Bangla Translation</title>
    <meta
      name="description"
      content="Read the complete Quran in Arabic with Bangla translation, listen to recitation, check prayer times, view the Islamic calendar and find nearby mosques."
    />

    <!-- Painted by the browser chrome; kept in step with the active theme by ThemeService. -->
    <meta name="theme-color" content="#0f5132" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1513" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph / social preview. Route-level values are set at runtime by SeoService. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Al-Quran" />
    <meta property="og:title" content="Al-Quran — Read the Quran with Bangla Translation" />
    <meta
      property="og:description"
      content="Read the complete Quran in Arabic with Bangla translation, listen to recitation, check prayer times and find nearby mosques."
    />
    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192x192.png" />

    <!-- PWA & Mobile Web App -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Al-Quran" />
    <meta name="application-name" content="Al-Quran" />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Al-Quran",
        "alternateName": ["আল-কুরআন", "Al-Quran App"],
        "url": "https://alquran.app",
        "description": "Read the complete Quran in Arabic with Bangla translation, listen to recitation, follow prayer times and find nearby mosques.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://alquran.app/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Fonts. preconnect shaves a round trip off the first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600&display=swap"
    />

    <!--
      Applies the saved theme before Angular boots so the page never flashes
      light before switching to dark. Keep this tiny and dependency free.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('alquran.theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {
          /* private mode or storage disabled - fall back to the system theme */
        }
      })();
    </script>
    <!--
      Initial App Splash & Golden Quran Opening Animation
    -->
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #04140e;
        color: #f8fafc;
        overflow: hidden;
        user-select: none;
        cursor: pointer;
        opacity: 1;
        transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.65s ease;
      }
      .app-splash.is-dismissed {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-splash__backdrop {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, #08281c 0%, #04140e 65%, #020b08 100%);
      }
      .app-splash__content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
        max-width: 360px;
        perspective: 1200px;
      }
      .app-splash__stage {
        position: relative;
        width: 220px;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-style: preserve-3d;
      }
      .app-splash__svg {
        overflow: visible;
      }
      .splash-badge-bg {
        opacity: 0;
        transform: scale(0.75);
        transform-origin: 256px 256px;
        transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .splash-badge-border {
        opacity: 0;
        stroke-dasharray: 1800;
        stroke-dashoffset: 1800;
        transition: stroke-dashoffset 1.3s ease, opacity 0.6s ease;
      }
      .state-assemble .splash-badge-bg {
        opacity: 1;
        transform: scale(1);
      }
      .state-assemble .splash-badge-border {
        opacity: 0.55;
        stroke-dashoffset: 0;
      }
      .splash-arch {
        stroke-dasharray: 600;
        stroke-dashoffset: 600;
        opacity: 0;
        transition: stroke-dashoffset 1.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.55s ease;
      }
      .state-arch .splash-arch {
        opacity: 1;
        stroke-dashoffset: 0;
      }
      .splash-sajdah {
        opacity: 0;
        transform: scale(0.2);
        transform-origin: 256px 250px;
        transition: all 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .state-mark .splash-sajdah {
        opacity: 1;
        transform: scale(1);
        filter: drop-shadow(0 0 16px rgba(245, 215, 127, 0.9));
      }
      .splash-static-pages {
        opacity: 0;
        transition: opacity 0.7s ease;
      }
      .show-page-lines .splash-static-pages {
        opacity: 0.75;
      }
      .splash-leaf {
        transform-origin: 0px 45px;
        transform-style: preserve-3d;
        opacity: 0;
        pointer-events: none;
      }
      .is-flipping .splash-leaf-1 {
        animation: splashFlip 1.6s cubic-bezier(0.3, 0.05, 0.2, 1) forwards;
      }
      .is-flipping .splash-leaf-2 {
        animation: splashFlip 1.6s cubic-bezier(0.3, 0.05, 0.2, 1) 0.28s forwards;
      }
      .is-flipping .splash-leaf-3 {
        animation: splashFlip 1.6s cubic-bezier(0.3, 0.05, 0.2, 1) 0.56s forwards;
      }
      @keyframes splashFlip {
        0% { opacity: 0; transform: rotateY(0deg) skewY(0deg); }
        10% { opacity: 0.95; }
        35% { transform: rotateY(-50deg) translateZ(24px) skewY(-4deg); filter: drop-shadow(0 8px 12px rgba(0,0,0,0.6)); }
        55% { transform: rotateY(-95deg) translateZ(32px) skewY(0deg); filter: drop-shadow(0 0 16px rgba(245,215,127,0.8)); opacity: 1; }
        78% { transform: rotateY(-145deg) translateZ(20px) skewY(4deg); opacity: 0.95; }
        95% { transform: rotateY(-180deg) translateZ(1px); opacity: 0.85; }
        100% { transform: rotateY(-180deg) translateZ(0px); opacity: 0; }
      }
      .splash-wing-left, .splash-wing-right {
        transform-origin: 0px 45px;
        transform: scaleX(0.05);
        transition: transform 0.95s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .splash-spine {
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      .app-splash__brand {
        opacity: 0;
        transform: translateY(18px);
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        margin-top: 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .app-splash__brand.show-brand {
        opacity: 1;
        transform: translateY(0);
      }
      .app-splash__title {
        margin: 0;
        font-size: 1.65rem;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.01em;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .app-splash__arabic {
        font-family: 'Amiri Quran', 'Traditional Arabic', serif;
        font-weight: 400;
        color: #f5d77f;
        font-size: 1.35rem;
      }
      .app-splash__tagline-bn {
        margin: 0.25rem 0 0;
        font-family: 'Noto Sans Bengali', sans-serif;
        font-size: 0.8125rem;
        font-weight: 600;
        color: #6ee7b7;
      }
      .app-splash__motto-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin-top: 0.45rem;
        padding: 0.2rem 0.75rem;
        border-radius: 9999px;
        background: rgba(212, 175, 55, 0.12);
        border: 1px solid rgba(212, 175, 55, 0.35);
      }
      .motto-star {
        color: #f5d77f;
        font-size: 0.65rem;
      }
      .motto-text {
        color: #fef08a;
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .app-splash__motto-sub {
        margin: 0.25rem 0 0;
        font-family: 'Noto Sans Bengali', sans-serif;
        font-size: 0.6875rem;
        color: rgba(167, 243, 208, 0.75);
      }
      .app-splash__bar {
        width: 140px;
        height: 3px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
        margin-top: 0.75rem;
      }
      .app-splash__bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #9a7a1c, #f5d77f, #d4af37);
        transition: width 1.8s cubic-bezier(0.1, 0.8, 0.2, 1);
      }
    </style>
  </head>

  <body>
    <!-- App Splash Loading Screen -->
    <div id="app-splash-overlay" class="app-splash" aria-hidden="true" title="Click to skip">
      <div class="app-splash__backdrop"></div>
      <div class="app-splash__content">
        <!-- SVG Book & Logo Stage -->
        <div class="app-splash__stage" id="splashStage">
          <svg viewBox="0 0 512 512" width="220" height="220" class="app-splash__svg">
            <defs>
              <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#14603c"/>
                <stop offset="100%" stop-color="#093621"/>
              </linearGradient>
              <linearGradient id="splashGold" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f5d77f"/>
                <stop offset="50%" stop-color="#c9a227"/>
                <stop offset="100%" stop-color="#9a7a1c"/>
              </linearGradient>
            </defs>

            <!-- 1. Background Badge -->
            <rect class="splash-badge-bg" width="512" height="512" rx="108" fill="url(#splashBg)"></rect>
            <!-- 2. Inner Golden Border -->
            <rect class="splash-badge-border" x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="url(#splashGold)" stroke-width="4.5"></rect>

            <g transform="translate(256, 256)">
              <!-- 3. Mihrab Arch -->
              <path class="splash-arch"
                    d="M0 -150 C55 -105 80 -70 80 0 C80 30 70 50 0 50 C-70 50 -80 30 -80 0 C-80 -70 -55 -105 0 -150 Z"
                    fill="none" stroke="url(#splashGold)" stroke-width="8.5" stroke-linecap="round"></path>

              <!-- 4. Sajdah Symbol ۩ -->
              <text class="splash-sajdah" x="0" y="8" font-family="'Amiri Quran', serif" font-size="78"
                    fill="url(#splashGold)" text-anchor="middle" dominant-baseline="central">۩</text>

              <!-- 5. Static Pages Inside Wings -->
              <g class="splash-static-pages">
                <path d="M-6 12 C-24 -4 -64 -22 -106 -4 L-106 58 C-64 40 -24 58 -6 74"
                      fill="none" stroke="url(#splashGold)" stroke-width="2.5" opacity="0.45"></path>
                <path d="M-5 16 C-22 0 -60 -18 -102 0 L-102 54 C-60 36 -22 54 -5 70"
                      fill="none" stroke="url(#splashGold)" stroke-width="2" opacity="0.35"></path>
                <line x1="-16" y1="20" x2="-95" y2="12" stroke="url(#splashGold)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"></line>
                <line x1="-15" y1="34" x2="-95" y2="26" stroke="url(#splashGold)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"></line>
                <line x1="-14" y1="48" x2="-92" y2="40" stroke="url(#splashGold)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"></line>

                <path d="M6 12 C24 -4 64 -22 106 -4 L106 58 C64 40 24 58 6 74"
                      fill="none" stroke="url(#splashGold)" stroke-width="2.5" opacity="0.45"></path>
                <path d="M5 16 C22 0 60 -18 102 0 L102 54 C60 36 22 54 5 70"
                      fill="none" stroke="url(#splashGold)" stroke-width="2" opacity="0.35"></path>
                <line x1="16" y1="20" x2="95" y2="12" stroke="url(#splashGold)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"></line>
                <line x1="15" y1="34" x2="95" y2="26" stroke="url(#splashGold)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"></line>
                <line x1="14" y1="48" x2="92" y2="40" stroke="url(#splashGold)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"></line>
              </g>

              <!-- 6. Turning Pages (Contained inside book) -->
              <g class="splash-turning-pages" id="splashTurningPages">
                <g class="splash-leaf splash-leaf-1">
                  <path d="M4 10 C22 -8 68 -26 110 -8 L110 60 C68 42 22 60 4 78 Z"
                        fill="rgba(212, 175, 55, 0.12)" stroke="url(#splashGold)" stroke-width="3" stroke-linejoin="round"></path>
                  <line x1="18" y1="18" x2="98" y2="10" stroke="url(#splashGold)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.75"></line>
                  <line x1="16" y1="32" x2="98" y2="24" stroke="url(#splashGold)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.75"></line>
                  <line x1="15" y1="46" x2="95" y2="38" stroke="url(#splashGold)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.75"></line>
                </g>
                <g class="splash-leaf splash-leaf-2">
                  <path d="M4 10 C22 -8 68 -26 110 -8 L110 60 C68 42 22 60 4 78 Z"
                        fill="rgba(245, 215, 127, 0.14)" stroke="url(#splashGold)" stroke-width="3" stroke-linejoin="round"></path>
                  <line x1="20" y1="20" x2="96" y2="12" stroke="url(#splashGold)" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"></line>
                  <line x1="18" y1="34" x2="96" y2="26" stroke="url(#splashGold)" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"></line>
                </g>
                <g class="splash-leaf splash-leaf-3">
                  <path d="M4 10 C22 -8 68 -26 110 -8 L110 60 C68 42 22 60 4 78 Z"
                        fill="rgba(212, 175, 55, 0.16)" stroke="url(#splashGold)" stroke-width="3.5" stroke-linejoin="round"></path>
                  <line x1="18" y1="18" x2="98" y2="10" stroke="url(#splashGold)" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.85"></line>
                  <line x1="16" y1="32" x2="98" y2="24" stroke="url(#splashGold)" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.85"></line>
                </g>
              </g>

              <!-- 7. Outer Book Rim -->
              <path class="splash-wing-left" id="splashWingLeft"
                    d="M0 0 C-20 -20 -70 -40 -120 -20 L-120 70 C-70 50 -20 70 0 90 Z"
                    fill="none" stroke="url(#splashGold)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"></path>
              <path class="splash-wing-right" id="splashWingRight"
                    d="M0 0 C20 -20 70 -40 120 -20 L120 70 C70 50 20 70 0 90 Z"
                    fill="none" stroke="url(#splashGold)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"></path>
              <line class="splash-spine" id="splashSpine" x1="0" y1="0" x2="0" y2="90" stroke="url(#splashGold)" stroke-width="12" stroke-linecap="round"></line>
            </g>
          </svg>
        </div>

        <!-- Typography & Taglines -->
        <div class="app-splash__brand" id="splashBrand">
          <h1 class="app-splash__title">
            <span>Al-Quran</span>
            <span class="app-splash__arabic">القرآن</span>
          </h1>
          <p class="app-splash__tagline-bn">পড়ুন · শুনুন · অনুধাবন করুন</p>
          <div class="app-splash__motto-badge">
            <span class="motto-star">✦</span>
            <span class="motto-text">The Complete Way of Life</span>
            <span class="motto-star">✦</span>
          </div>
          <p class="app-splash__motto-sub">মানবজাতির পূর্ণাঙ্গ জীবনবিধান</p>
          <div class="app-splash__bar">
            <div class="app-splash__bar-fill" id="splashProgress"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Splash Screen Sequence Controller -->
    <script>
      (function () {
        var splash = document.getElementById('app-splash-overlay');
        var stage = document.getElementById('splashStage');
        var brand = document.getElementById('splashBrand');
        var leftWing = document.getElementById('splashWingLeft');
        var rightWing = document.getElementById('splashWingRight');
        var spine = document.getElementById('splashSpine');
        var pages = document.getElementById('splashTurningPages');
        var progress = document.getElementById('splashProgress');
        if (!splash) return;

        // Step 1: Book wings open smoothly
        setTimeout(function () {
          if (leftWing) leftWing.style.transform = 'scaleX(1)';
          if (rightWing) rightWing.style.transform = 'scaleX(1)';
          if (spine) spine.style.opacity = '1';
          if (stage) stage.classList.add('show-page-lines');
          if (progress) progress.style.width = '35%';
        }, 80);

        // Step 2: Golden pages flip inside book
        setTimeout(function () {
          if (pages) pages.classList.add('is-flipping');
          if (progress) progress.style.width = '65%';
        }, 680);

        // Step 3: Arch and Sajdah mark appear
        setTimeout(function () {
          if (stage) {
            stage.classList.add('state-arch');
            stage.classList.add('state-mark');
          }
          if (progress) progress.style.width = '85%';
        }, 1600);

        // Step 4: Emblem assembles and Brand Title glides up
        setTimeout(function () {
          if (stage) {
            stage.classList.add('state-assemble');
          }
          if (brand) brand.classList.add('show-brand');
          if (progress) progress.style.width = '100%';
        }, 2150);

        // Step 5: Smooth fade out overlay and unmount
        function dismissSplash() {
          if (!splash || splash.classList.contains('is-dismissed')) return;
          splash.classList.add('is-dismissed');
          setTimeout(function () {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 700);
        }

        // Tap/click to skip immediately
        splash.addEventListener('click', dismissSplash);

        // Auto dismiss after sequence finishes
        setTimeout(dismissSplash, 3300);
      })();
    </script>

    <aq-root></aq-root>
    <noscript>
      This application needs JavaScript enabled to read the Quran, play recitation and
      calculate prayer times.
    </noscript>
  </body>
</html>
