<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Al-Quran — Read the Quran with Bangla Translation</title>
    <meta
      name="description"
      content="Read the complete Quran in Arabic with Bangla translation, listen to recitation, check prayer times, view the Islamic calendar and find nearby mosques."
    />

    <!-- Painted by the browser chrome; kept in step with the active theme by ThemeService. -->
    <meta name="theme-color" content="#0f5132" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1513" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph / social preview. Route-level values are set at runtime by SeoService. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Al-Quran" />
    <meta property="og:title" content="Al-Quran — Read the Quran with Bangla Translation" />
    <meta
      property="og:description"
      content="Read the complete Quran in Arabic with Bangla translation, listen to recitation, check prayer times and find nearby mosques."
    />
    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192x192.png" />

    <!-- PWA & Mobile Web App -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Al-Quran" />
    <meta name="application-name" content="Al-Quran" />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Al-Quran",
        "alternateName": ["আল-কুরআন", "Al-Quran App"],
        "url": "https://alquran.app",
        "description": "Read the complete Quran in Arabic with Bangla translation, listen to recitation, follow prayer times and find nearby mosques.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://alquran.app/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Fonts. preconnect shaves a round trip off the first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600&display=swap"
    />

    <!--
      Applies the saved theme & language before Angular boots so the page never flashes
      light or wrong language before switching. Keep this tiny and dependency free.
    -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('alquran.theme');
          if (savedTheme === 'dark' || savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', savedTheme);
          }
          var savedLang = localStorage.getItem('alquran.language');
          if (savedLang) {
            try {
              var parsed = JSON.parse(savedLang);
              if (parsed === 'en' || parsed === 'bn') {
                document.documentElement.setAttribute('lang', parsed);
              }
            } catch (e) {}
          } else {
            document.documentElement.setAttribute('lang', 'bn');
          }
        } catch (e) {
          /* private mode or storage disabled - fall back to defaults */
        }
      })();
    </script>
    <!--
      Initial App Splash & Golden Quran Opening Animation
    -->
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #04140e;
        color: #f8fafc;
        overflow: hidden;
        user-select: none;
        cursor: pointer;
        opacity: 1;
        transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.65s ease;
      }
      .app-splash.is-dismissed {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-splash__backdrop {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, #08281c 0%, #04140e 65%, #020b08 100%);
      }
      .app-splash__content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
        max-width: 360px;
        perspective: 1200px;
      }
      /* Splash SVG Emblem Components */
      .app-splash__stage {
        position: relative;
        width: 220px;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-splash__svg {
        overflow: visible;
        filter: drop-shadow(0 14px 28px rgba(4, 32, 20, 0.45));
      }
      .splash-badge-bg {
        opacity: 0;
        transform: scale(0.85);
        transform-origin: 256px 256px;
        transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .splash-badge-border {
        opacity: 0;
        stroke-dasharray: 1800;
        stroke-dashoffset: 1800;
        transition: stroke-dashoffset 1.3s ease, opacity 0.6s ease;
      }
      .splash-ambient-glow {
        opacity: 0;
        transition: opacity 1.2s ease;
      }
      .splash-arch {
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        opacity: 0;
        transition: stroke-dashoffset 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease;
      }
      .splash-book {
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        opacity: 0;
        transition: stroke-dashoffset 1.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease;
      }
      .splash-spine {
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      .splash-page-inner {
        opacity: 0;
        transition: opacity 0.8s ease;
      }
      .splash-rosette {
        opacity: 0;
        transform: scale(0);
        transform-origin: 256px 335px;
        transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
      }

      /* Animated states triggered by controller */
      .state-badge .splash-badge-bg {
        opacity: 1;
        transform: scale(1);
      }
      .state-badge .splash-badge-border {
        opacity: 0.65;
        stroke-dashoffset: 0;
      }
      .state-badge .splash-ambient-glow {
        opacity: 0.3;
      }
      .state-arch .splash-arch {
        opacity: 1;
        stroke-dashoffset: 0;
      }
      .state-book .splash-book {
        opacity: 1;
        stroke-dashoffset: 0;
      }
      .state-book .splash-spine {
        opacity: 1;
      }
      .state-book .splash-page-inner {
        opacity: 0.85;
      }
      .state-rosette .splash-rosette {
        opacity: 1;
        transform: scale(1);
      }
      .app-splash__brand {
        opacity: 0;
        transform: translateY(18px);
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        margin-top: 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .app-splash__brand.show-brand {
        opacity: 1;
        transform: translateY(0);
      }
      .app-splash__title {
        margin: 0;
        font-size: 1.65rem;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.01em;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .app-splash__arabic {
        font-family: 'Amiri Quran', 'Traditional Arabic', serif;
        font-weight: 400;
        color: #f5d77f;
        font-size: 1.35rem;
      }
      .app-splash__tagline-bn {
        margin: 0.25rem 0 0;
        font-family: 'Noto Sans Bengali', sans-serif;
        font-size: 0.8125rem;
        font-weight: 600;
        color: #6ee7b7;
      }
      .app-splash__motto-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin-top: 0.45rem;
        padding: 0.2rem 0.75rem;
        border-radius: 9999px;
        background: rgba(212, 175, 55, 0.12);
        border: 1px solid rgba(212, 175, 55, 0.35);
      }
      .motto-star {
        color: #f5d77f;
        font-size: 0.65rem;
      }
      .motto-text {
        color: #fef08a;
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .app-splash__motto-sub {
        margin: 0.25rem 0 0;
        font-family: 'Noto Sans Bengali', sans-serif;
        font-size: 0.6875rem;
        color: rgba(167, 243, 208, 0.75);
      }
      .app-splash__bar {
        width: 140px;
        height: 3px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
        margin-top: 0.75rem;
      }
      .app-splash__bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #9a7a1c, #f5d77f, #d4af37);
        transition: width 1.8s cubic-bezier(0.1, 0.8, 0.2, 1);
      }
    </style>
  </head>

  <body>
    <!-- App Splash Loading Screen -->
    <div id="app-splash-overlay" class="app-splash" aria-hidden="true" title="Click to skip">
      <div class="app-splash__backdrop"></div>
      <div class="app-splash__content">
        <!-- SVG Book & Logo Stage -->
        <div class="app-splash__stage" id="splashStage">
          <svg viewBox="0 0 512 512" width="220" height="220" class="app-splash__svg">
            <defs>
              <linearGradient id="splashBg" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#145b3a"/>
                <stop offset="30%" stop-color="#0f4a2f"/>
                <stop offset="70%" stop-color="#093521"/>
                <stop offset="100%" stop-color="#042014"/>
              </linearGradient>

              <linearGradient id="splashGold" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#fae49d"/>
                <stop offset="35%" stop-color="#e2bf5c"/>
                <stop offset="70%" stop-color="#ca9f33"/>
                <stop offset="100%" stop-color="#a47c1b"/>
              </linearGradient>

              <linearGradient id="splashGoldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f5dc8e"/>
                <stop offset="50%" stop-color="#c99e31"/>
                <stop offset="100%" stop-color="#8f6a14"/>
              </linearGradient>

              <radialGradient id="splashEmblemGlow" cx="50%" cy="52%" r="45%">
                <stop offset="0%" stop-color="#dfbd58" stop-opacity="0.28"/>
                <stop offset="60%" stop-color="#dfbd58" stop-opacity="0.08"/>
                <stop offset="100%" stop-color="#dfbd58" stop-opacity="0"/>
              </radialGradient>
            </defs>

            <!-- 1. Squircle Container -->
            <rect class="splash-badge-bg" x="16" y="16" width="480" height="480" rx="116" fill="url(#splashBg)"/>

            <!-- 2. Inset Thin Gold Rounded Border -->
            <rect class="splash-badge-border" x="42" y="42" width="428" height="428" rx="88" fill="none" stroke="url(#splashGoldBorder)" stroke-width="4" opacity="0.65"/>

            <!-- 3. Ambient Gold Backlight -->
            <circle class="splash-ambient-glow" cx="256" cy="265" r="170" fill="url(#splashEmblemGlow)"/>

            <!-- 4. Master Emblem (Zero black lines, zero dashed marks) -->
            <g class="splash-emblem-group">
              <!-- A. The Teardrop Dome / Mihrab Arch -->
              <path class="splash-arch"
                    d="M256 122 C278 170 326 218 326 264 C326 298 304 322 278 328 M256 122 C234 170 186 218 186 264 C186 298 208 322 234 328"
                    fill="none" stroke="url(#splashGold)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

              <!-- B. The Open Holy Quran Outer Shell -->
              <path class="splash-book"
                    d="M116 274 C136 256 172 244 206 250 C228 254 246 266 256 284 C266 266 284 254 306 250 C340 244 376 256 396 274 L396 348 C376 332 338 326 304 336 C282 342 266 358 256 396 C246 358 230 342 208 336 C174 326 136 332 116 348 Z"
                    fill="none" stroke="url(#splashGold)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

              <!-- Center Spine Valley Line -->
              <line class="splash-spine" x1="256" y1="284" x2="256" y2="396" stroke="url(#splashGold)" stroke-width="9" stroke-linecap="round"/>

              <!-- C. Left Page Inner Border -->
              <path class="splash-page-inner"
                    d="M132 284 C150 270 180 260 206 266 C224 270 238 280 246 294 L246 364 C238 350 224 342 206 346 C180 352 150 342 132 334 Z"
                    fill="none" stroke="url(#splashGold)" stroke-width="3.5" opacity="0.85"/>

              <!-- D. Right Page Inner Border -->
              <path class="splash-page-inner"
                    d="M380 284 C362 270 332 260 306 266 C288 270 274 280 266 294 L266 364 C274 350 288 342 306 346 C332 352 362 342 380 334 Z"
                    fill="none" stroke="url(#splashGold)" stroke-width="3.5" opacity="0.85"/>

              <!-- E. Center Arabesque Rosette Medallion -->
              <g class="splash-rosette" transform="translate(256, 335)">
                <circle cx="0" cy="0" r="14" fill="none" stroke="url(#splashGold)" stroke-width="3"/>
                <circle cx="0" cy="0" r="4.5" fill="url(#splashGold)"/>
                <path d="M0 -14 C-3.5 -8 -3.5 -3 0 0 C3.5 -3 3.5 -8 0 -14 Z" fill="url(#splashGold)"/>
                <path d="M0 14 C-3.5 8 -3.5 3 0 0 C3.5 3 3.5 8 0 14 Z" fill="url(#splashGold)"/>
                <path d="M-14 0 C-8 -3.5 -3 -3.5 0 0 C-3 3.5 -8 3.5 -14 0 Z" fill="url(#splashGold)"/>
                <path d="M14 0 C8 -3.5 3 -3.5 0 0 C3 3.5 8 3.5 14 0 Z" fill="url(#splashGold)"/>
                <circle cx="-7.5" cy="-7.5" r="2.5" fill="url(#splashGold)"/>
                <circle cx="7.5" cy="-7.5" r="2.5" fill="url(#splashGold)"/>
                <circle cx="-7.5" cy="7.5" r="2.5" fill="url(#splashGold)"/>
                <circle cx="7.5" cy="7.5" r="2.5" fill="url(#splashGold)"/>
              </g>
            </g>
          </svg>
        </div>

        <!-- Typography & Taglines -->
        <div class="app-splash__brand" id="splashBrand">
          <h1 class="app-splash__title">
            <span>Al-Quran</span>
            <span class="app-splash__arabic">القرآن</span>
          </h1>
          <p class="app-splash__tagline-bn">পড়ুন · শুনুন · অনুধাবন করুন</p>
          <div class="app-splash__motto-badge">
            <span class="motto-star">✦</span>
            <span class="motto-text">The Complete Way of Life</span>
            <span class="motto-star">✦</span>
          </div>
          <p class="app-splash__motto-sub">মানবজাতির পূর্ণাঙ্গ জীবনবিধান</p>
          <div class="app-splash__bar">
            <div class="app-splash__bar-fill" id="splashProgress"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Splash Screen Sequence Controller -->
    <script>
      (function () {
        var splash = document.getElementById('app-splash-overlay');
        var stage = document.getElementById('splashStage');
        var brand = document.getElementById('splashBrand');
        var progress = document.getElementById('splashProgress');
        if (!splash) return;

        // Step 1: Squircle Badge with emerald glow appears
        setTimeout(function () {
          if (stage) stage.classList.add('state-badge');
          if (progress) progress.style.width = '30%';
        }, 80);

        // Step 2: Teardrop Arch draws in
        setTimeout(function () {
          if (stage) stage.classList.add('state-arch');
          if (progress) progress.style.width = '55%';
        }, 550);

        // Step 3: Sacred Quran pages and spine outline glide in
        setTimeout(function () {
          if (stage) stage.classList.add('state-book');
          if (progress) progress.style.width = '75%';
        }, 950);

        // Step 4: Arabesque Rosette Medallion blossoms at spine
        setTimeout(function () {
          if (stage) stage.classList.add('state-rosette');
          if (brand) brand.classList.add('show-brand');
          if (progress) progress.style.width = '100%';
        }, 1450);

        // Step 5: Smooth fade out overlay and unmount
        function dismissSplash() {
          if (!splash || splash.classList.contains('is-dismissed')) return;
          splash.classList.add('is-dismissed');
          setTimeout(function () {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 600);
        }

        // Tap/click to skip immediately
        splash.addEventListener('click', dismissSplash);

        // Auto dismiss after sequence finishes
        setTimeout(dismissSplash, 2700);
      })();
    </script>

    <aq-root></aq-root>
    <noscript>
      This application needs JavaScript enabled to read the Quran, play recitation and
      calculate prayer times.
    </noscript>
  </body>
</html>
