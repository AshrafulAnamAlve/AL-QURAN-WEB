    <!--
      Applies the saved theme & language before Angular boots so the page never flashes
      light or wrong language before switching. Keep this tiny and dependency free.
    -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('alquran.theme');
          if (savedTheme === 'dark' || savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', savedTheme);
          }
          var savedLang = localStorage.getItem('alquran.language');
          if (savedLang) {
            try {
              var parsed = JSON.parse(savedLang);
              if (parsed === 'en' || parsed === 'bn') {
                document.documentElement.setAttribute('lang', parsed);
              }
            } catch (e) {}
          } else {
            document.documentElement.setAttribute('lang', 'bn');
          }
        } catch (e) {
          /* private mode or storage disabled - fall back to defaults */
        }
      })();
    </script>
    <!--
      Initial App Splash & Golden Quran Opening Animation
    -->
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #04140e;
        color: #f8fafc;
        overflow: hidden;
        user-select: none;
        cursor: pointer;
        opacity: 1;
        transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.65s ease;
      }
      .app-splash.is-dismissed {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-splash__backdrop {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, #08281c 0%, #04140e 65%, #020b08 100%);
      }
      .app-splash__content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
        max-width: 360px;
        perspective: 1200px;
      }
      .app-splash__stage {
        position: relative;
        width: 220px;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-style: preserve-3d;
      }
      .app-splash__svg {
        overflow: visible;
      }
      .splash-badge-bg {
        opacity: 0;
        transform: scale(0.75);
        transform-origin: 256px 256px;
        transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .splash-badge-border {
        opacity: 0;
        stroke-dasharray: 1800;
        stroke-dashoffset: 1800;
        transition: stroke-dashoffset 1.3s ease, opacity 0.6s ease;
      }
      .state-assemble .splash-badge-bg {
        opacity: 1;
        transform: scale(1);
      }
      .state-assemble .splash-badge-border {
        opacity: 0.55;
        stroke-dashoffset: 0;
      }
      .splash-arch {
        stroke-dasharray: 600;
        stroke-dashoffset: 600;
        opacity: 0;
        transition: stroke-dashoffset 1.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.55s ease;
      }
      .state-arch .splash-arch {
        opacity: 1;
        stroke-dashoffset: 0;
      }

    <!-- Splash Screen Sequence Controller -->
    <script>
      (function () {
        var splash = document.getElementById('app-splash-overlay');
        var stage = document.getElementById('splashStage');
        var brand = document.getElementById('splashBrand');
        var leftWing = document.getElementById('splashWingLeft');
        var rightWing = document.getElementById('splashWingRight');
        var spine = document.getElementById('splashSpine');
        var pages = document.getElementById('splashTurningPages');
        var progress = document.getElementById('splashProgress');
        if (!splash) return;

        // Step 1: Book wings open smoothly
        setTimeout(function () {
          if (leftWing) leftWing.style.transform = 'scaleX(1)';
          if (rightWing) rightWing.style.transform = 'scaleX(1)';
          if (spine) spine.style.opacity = '1';
          if (stage) stage.classList.add('show-page-lines');
          if (progress) progress.style.width = '35%';
        }, 80);

        // Step 2: Golden pages flip inside book
        setTimeout(function () {
          if (pages) pages.classList.add('is-flipping');
          if (progress) progress.style.width = '65%';
        }, 680);

        // Step 3: Arch and Sajdah mark appear
        setTimeout(function () {
          if (stage) {
            stage.classList.add('state-arch');
            stage.classList.add('state-mark');
          }
          if (progress) progress.style.width = '85%';
        }, 1600);

        // Step 4: Emblem assembles and Brand Title glides up
        setTimeout(function () {
          if (stage) {
            stage.classList.add('state-assemble');
          }
          if (brand) brand.classList.add('show-brand');
          if (progress) progress.style.width = '100%';
        }, 2150);

        // Step 5: Smooth fade out overlay and unmount
        function dismissSplash() {
          if (!splash || splash.classList.contains('is-dismissed')) return;
          splash.classList.add('is-dismissed');
          setTimeout(function () {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 700);
        }

        // Tap/click to skip immediately
        splash.addEventListener('click', dismissSplash);

        // Auto dismiss after sequence finishes
        setTimeout(dismissSplash, 3300);
      })();
    </script>
