    <!--
      Applies the saved theme & language before Angular boots so the page never flashes
      light or wrong language before switching. Keep this tiny and dependency free.
    -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('alquran.theme');
          if (savedTheme === 'dark' || savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', savedTheme);
          }
          var savedLang = localStorage.getItem('alquran.language');
          if (savedLang) {
            try {
              var parsed = JSON.parse(savedLang);
              if (parsed === 'en' || parsed === 'bn') {
                document.documentElement.setAttribute('lang', parsed);
              }
            } catch (e) {}
          } else {
            document.documentElement.setAttribute('lang', 'bn');
          }
        } catch (e) {
          /* private mode or storage disabled - fall back to defaults */
        }
      })();
    </script>

      Initial App Splash & Golden Quran Opening Animation

    <!-- Splash Screen Styles: Pure Hardware-Accelerated Declarative CSS Keyframes -->
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #04140e;
        color: #f8fafc;
        overflow: hidden;
        user-select: none;
        cursor: pointer;
        opacity: 1;
        transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s ease;
        will-change: opacity, transform;
      }
      .app-splash.is-dismissed {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
        visibility: hidden;
      }
      .app-splash__backdrop {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, #08281c 0%, #04140e 65%, #020b08 100%);
      }
      .app-splash__content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
        max-width: 360px;
        perspective: 1200px;
      }
      /* Splash SVG Emblem Components */
      .app-splash__stage {
        position: relative;
        width: 220px;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-splash__svg {
        overflow: visible;
        filter: drop-shadow(0 14px 28px rgba(4, 32, 20, 0.5));
      }

      /* 1. Squircle Background */
      .splash-badge-bg {
        transform-origin: 256px 256px;
        animation: splashBadgeEnter 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
      }
      @keyframes splashBadgeEnter {
        0% { opacity: 0; transform: scale(0.86); }
        100% { opacity: 1; transform: scale(1); }
      }

      /* 2. Inset Thin Gold Rounded Border */
      .splash-badge-border {
        stroke-dasharray: 1570;
        stroke-dashoffset: 1570;
        animation: splashBorderDraw 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
      }
      @keyframes splashBorderDraw {
        0% { stroke-dashoffset: 1570; opacity: 0; }
        25% { opacity: 0.7; }
        100% { stroke-dashoffset: 0; opacity: 0.7; }
      }

      /* 3. Ambient Backlight Glow */
      .splash-ambient-glow {
        opacity: 0;
        transform-origin: 256px 265px;
        animation: splashGlowEnter 0.9s ease-out 0.25s forwards, splashGlowPulse 2.4s ease-in-out 1.1s infinite alternate;
      }
      @keyframes splashGlowEnter {
        0% { opacity: 0; transform: scale(0.75); }
        100% { opacity: 0.35; transform: scale(1); }
      }
      @keyframes splashGlowPulse {
        0% { opacity: 0.35; transform: scale(1); }
        100% { opacity: 0.52; transform: scale(1.08); }
      }

      /* 4. Mihrab Arch (peaks down simultaneously with normalized pathLength) */
      .splash-arch-l,
      .splash-arch-r {
        stroke-dasharray: 1.01;
        stroke-dashoffset: 1.01;
        animation: splashDrawPath 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.22s forwards;
      }
      @keyframes splashDrawPath {
        0% { stroke-dashoffset: 1.01; opacity: 0; }
        15% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }

      /* 5. Open Holy Quran Outer Shell (wings glide outward from spine) */
      .splash-book-l,
      .splash-book-r {
        stroke-dasharray: 1.01;
        stroke-dashoffset: 1.01;
        animation: splashDrawBook 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.38s forwards;
      }
      @keyframes splashDrawBook {
        0% { stroke-dashoffset: 1.01; opacity: 0; }
        15% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }

      /* 6. Center Spine Valley Line */
      .splash-spine {
        stroke-dasharray: 1.01;
        stroke-dashoffset: 1.01;
        animation: splashDrawSpine 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
      }
      @keyframes splashDrawSpine {
        0% { stroke-dashoffset: 1.01; opacity: 0; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }

      /* 7. Inner Page Borders */
      .splash-page-l,
      .splash-page-r {
        stroke-dasharray: 1.01;
        stroke-dashoffset: 1.01;
        animation: splashDrawPage 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.56s forwards;
      }
      @keyframes splashDrawPage {
        0% { stroke-dashoffset: 1.01; opacity: 0; }
        100% { stroke-dashoffset: 0; opacity: 0.85; }
      }

      /* 8. Center Arabesque Rosette Medallion (spring pop bloom from center (0,0)) */
      .splash-rosette {
        transform-origin: 0 0;
        animation: splashRosetteBloom 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 0.72s forwards;
      }
      @keyframes splashRosetteBloom {
        0% { transform: scale(0); opacity: 0; }
        40% { opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }

      /* 9. Warm Divine Glow on Completed Master Emblem */
      .splash-emblem-group {
        transform-origin: 256px 265px;
        animation: splashEmblemBloom 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both,
                   splashEmblemShine 1.8s ease-in-out 0.2s both;
      }
      @keyframes splashEmblemBloom {
        0% { opacity: 0; transform: scale(0.92); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes splashEmblemShine {
        0% { filter: drop-shadow(0 0 0 rgba(250, 228, 157, 0)); }
        70% { filter: drop-shadow(0 0 10px rgba(250, 228, 157, 0.65)); }
        100% { filter: drop-shadow(0 0 5px rgba(250, 228, 157, 0.35)); }
      }

      /* Brand Section Entrance */
      .app-splash__brand {
        margin-top: 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: splashBrandRise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both;
      }
      @keyframes splashBrandRise {
        0% { opacity: 0; transform: translateY(16px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .app-splash__title {
        margin: 0;
        font-size: 1.65rem;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.01em;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .app-splash__arabic {
        font-family: 'Amiri Quran', 'Traditional Arabic', serif;
        font-weight: 400;
        color: #f5d77f;
        font-size: 1.35rem;
      }
      .app-splash__tagline-bn {
        margin: 0.25rem 0 0;
        font-family: 'Noto Sans Bengali', sans-serif;
        font-size: 0.8125rem;
        font-weight: 600;
        color: #6ee7b7;
      }
      .app-splash__motto-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin-top: 0.45rem;
        padding: 0.2rem 0.75rem;
        border-radius: 9999px;
        background: rgba(212, 175, 55, 0.12);
        border: 1px solid rgba(212, 175, 55, 0.35);
      }
      .motto-star {
        color: #f5d77f;
        font-size: 0.65rem;
      }
      .motto-text {
        color: #fef08a;
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .app-splash__motto-sub {
        margin: 0.25rem 0 0;
        font-family: 'Noto Sans Bengali', sans-serif;
        font-size: 0.6875rem;
        color: rgba(167, 243, 208, 0.75);
      }
      .app-splash__bar {
        width: 140px;
        height: 3px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
        margin-top: 0.75rem;
      }
      .app-splash__bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #9a7a1c, #f5d77f, #d4af37);
        animation: splashProgressFill 1.85s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s forwards;
      }
      @keyframes splashProgressFill {
        0% { width: 0%; }
        45% { width: 50%; }
        80% { width: 88%; }
        100% { width: 100%; }
      }
    </style>

        <!-- SVG Book & Logo Stage -->

          <svg viewBox="0 0 512 512" width="220" height="220" class="app-splash__svg">
