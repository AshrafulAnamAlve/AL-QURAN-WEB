name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'frontend/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Mobile Dependencies & Sync Capacitor
        run: |
          cd mobile
          npm ci
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: |
          cd mobile/android
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/android/app/build/outputs/apk/debug/AlQuran-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlQuran-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/AlQuran-Android.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.0-mobile
          name: 'Al-Quran Mobile Android APK v1.4.0'
          body: |
            ### Al-Quran Android Mobile Application v1.4.0 (.apk)
            
            #### 🌟 What's New in v1.4.0:
            - **Stories of the 25 Prophets (কাসাসুল আম্বিয়া)**: Complete authentic biographies of all 25 Prophets in Islam with bilingual Bangla/English text and synchronized audio narration.
            - **Deep-Sleep Screen Wake & Lockscreen Adhan**: Reliable background prayer alerts that light up the display and execute full-screen lock intent even in deep Doze mode.
            - **Hardware Alarm Audio Stream**: Playback through `USAGE_ALARM` with DND bypass and 14-day advance auto-replenishment scheduler.
            - **Balanced Mobile UI & Quick Actions**: Home screen 3x3 quick action pillars (Quran, Hadith, Prophets, Prayer, Qibla, Tasbih, Habits, Ruqyah, Mosques) and zero-blowout header navigation.
            - **Universal Islamic Noor AI**: Enhanced AI intent guidance ensuring every question related to Islam is answered comprehensively.
          draft: false
          prerelease: false
          files: mobile/android/app/build/outputs/apk/debug/AlQuran-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
